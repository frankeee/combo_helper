name: file_shelf
description: "File Shelf - organize your files and notes in folders."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  english_words: ^4.0.0
  provider: ^6.1.5+1
  file_picker: ^10.3.8
  audioplayers: ^6.5.1
  share_plus: ^12.0.1
  receive_sharing_intent: ^1.8.1
  shared_preferences: ^2.5.4
  path_provider: ^2.1.5
  flutter_linkify: ^6.0.0
  url_launcher: ^6.3.2
  audio_waveforms: ^2.0.2
  path: ^1.9.1
  pdfx: ^2.9.2
  audioplayers_platform_interface: ^7.1.1
  plugin_platform_interface: ^2.1.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#F5A800"
  adaptive_icon_foreground: "assets/icon/icon.png"

flutter_native_splash:
  color: "#FFFFFF"
  image: "assets/splash/splash.png"
  ios: true
  android: true

flutter:
  uses-material-design: true

  assets:
    - assets/icon/
    - assets/splash/